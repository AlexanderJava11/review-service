spring.application.name=review-service
server.port=8082

spring.datasource.url=${REVIEW_DB_URL:jdbc:mysql://localhost:3309/reviewdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${REVIEW_DB_USERNAME:root}
spring.datasource.password=${REVIEW_DB_PASSWORD:reviewpassword}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

booking.service.web-url=${BOOKING_SERVICE_WEB_URL:http://localhost:8080}